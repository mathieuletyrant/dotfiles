name: Test

on: [push]

jobs:
  build:

    runs-on: macOS-latest
    
    steps:
    - name: Install Homebrew
      shell: bash
      run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    - name: Install Stow
      shell: bash
      run: brew install stow
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Remove runner's preinstalled gitconfig (conflicts with stow)
      run: rm -f ~/.gitconfig
    - name: Execute full install
      run:  ./install.sh
      env:
        # App Store apps need a signed-in Apple ID (Xcode, Hyperduck)
        HOMEBREW_BUNDLE_MAS_SKIP: "497799835 6444667067"
    - name: Check zshrc
      run: ./test.sh
